[project]
name = "neural-to-ink"
version = "0.1.0"
description = "Convert a pinned static embedding model to Ink and benchmark checked optimization."
requires-python = ">=3.12"
dependencies = ["model2vec==0.7.0", "numpy==2.5.4", "safetensors==0.8.0", "huggingface-hub==2.4.0", "tokenizers==0.23.3"]

[project.scripts]
neural-to-ink = "neural_to_ink.__main__:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
